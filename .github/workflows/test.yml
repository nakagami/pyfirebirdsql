name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        firebird-version: ['2.5-sc', '2.5-ss', '3', '4', '5']
        include:
          - firebird-version: '2.5-sc'
            firebird-image: 'jacobalberty/firebird:2.5-sc'
          - firebird-version: '2.5-ss'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
          - firebird-version: '3'
            firebird-image: 'firebirdsql/firebird:3'
          - firebird-version: '4'
            firebird-image: 'firebirdsql/firebird:4'
          - firebird-version: '5'
            firebird-image: 'firebirdsql/firebird:5'

    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        volumes:
          - /tmp:/tmp
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
          # Same settings as misc/firebird.conf
          FIREBIRD_CONF_AuthServer: Srp256, Srp, Legacy_Auth
          FIREBIRD_CONF_WireCrypt: Enabled
          FIREBIRD_CONF_DefaultTimeZone: GMT
        ports:
          - 3050:3050
        # The job waits until the server accepts connections inside the container
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install setuptools
        python -m pip install --upgrade pip
        python -m pip install passlib
        python -m pip install pytest
    - name: Test
      env:
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
      run: |
        pytest
